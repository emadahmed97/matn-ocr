name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan hf-deploy
          git add -A
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          git commit -m "${COMMIT_MSG:-Deploy to HuggingFace Spaces}"
          git push --force https://emadahmed97:$HF_TOKEN@huggingface.co/spaces/emadahmed97/arabic-ocr-trainer hf-deploy:main
